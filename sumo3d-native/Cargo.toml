[package]
name = "sumo3d-native"
version = "0.1.0"
edition = "2021"
description = "Native GPU SUMO 3D viewer (Bevy + TraCI WebSocket bridge)"

[dependencies]
bevy = { version = "0.15", default-features = true, features = ["jpeg"] }
bevy_egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
url = "2"
anyhow = "1"

# Debug is fine for testing (fast compile). Release keeps usable speed without
# full LTO so `cargo build --release` doesn't take ~10 minutes every tweak.
[profile.release]
lto = false
codegen-units = 16
opt-level = 3
